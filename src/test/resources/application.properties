spring.datasource.url=jdbc:h2:mem:PageTurner;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
jwt.secret=test-secret-key-test-secret-key-test-secret-key-123456
jwt.expiration=3600000
# Disable Hibernate multitenancy in tests to avoid requiring a tenant identifier
spring.jpa.properties.hibernate.multitenancy.strategy=org.hibernate.MultiTenancyStrategy.NONE
# Ensure no resolver is used during tests
spring.jpa.properties.hibernate.multitenancy.identifier_resolver=
# Defer repository bootstrap to avoid early EntityManager creation during context startup
spring.data.jpa.repositories.bootstrap-mode=deferred
# Disable Spring Data JPA repository auto-configuration in tests to avoid repository bean creation
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration