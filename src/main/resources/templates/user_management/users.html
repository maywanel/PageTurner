<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members · PageTurner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/library.css">
    <script src="/js/session.js"></script>
</head>
<body class="page-users">
<a class="skip-link" href="#main-content">Skip to content</a><nav class="site-nav" aria-label="Main navigation"><a class="brand-logo" href="/home"><span class="brand-mark" aria-hidden="true">P<span>t</span></span>PageTurner<span class="brand-dot">.</span></a><div class="nav-links"><a href="/home">Discover</a><a href="/admin">Dashboard</a><a href="/admin/users">Members</a><a href="/systeminfo">System</a><a href="/settings">Account</a></div></nav>
    <div class="admin-container" id="main-content" role="main">
        <div class="admin-header">
            <h1>User Management</h1>
            <p>Admin Panel - Manage users and permissions</p>
        </div>

        <div class="card">
            <h2>Add New User</h2>
            <form id="userForm" class="user-form">
                <input type="hidden" id="userId" />
                <div class="form-field">
                    <label for="userName">Full Name</label>
                    <input type="text" id="userName" placeholder="Full Name" required />
                </div>
                <div class="form-field">
                    <label for="userEmail">Email Address</label>
                    <input autocomplete="email" type="email" id="userEmail" placeholder="Email Address" required />
                </div>
                <div class="form-field">
                    <label for="userPassword">Password <span class="password-note" id="passwordNote">(min. 6 characters)</span></label>
                    <input autocomplete="new-password" type="password" id="userPassword" placeholder="Password" minlength="6" required />
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">➕ Add User</button>
                <button type="button" class="btn btn-cancel" id="cancelBtn" style="display: none;">❌ Cancel</button>
            </form>
        </div>

        <div class="card">
            <h2>Users List</h2>
            <div class="users-table-container">
                <table class="users-table" id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5" class="no-users">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let editingUserId = null;
        let loadedUsers = [];
        function isAdmin(user) { return ['SUPER_ADMIN', 'TENANT_ADMIN'].includes(user.role); }

        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            loadUsers();
        });

        async function checkAdminAccess() {
            try {
                const user = await PageTurnerSession.currentUser();
                if (!['SUPER_ADMIN', 'TENANT_ADMIN'].includes(user.role)) location.replace('/error/403');
            } catch { /* The shared session handler redirects expired sessions. */ }
        }

        // Form submission handler
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('userEmail').value.trim();
            const password = document.getElementById('userPassword').value;

            if (!name || !email || (!password && !editingUserId)) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            if (password.length < 6 && password.length > 0) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }

            if (editingUserId) {
                updateUser(editingUserId, name, email, password);
            } else {
                addUser(name, email, password);
            }
        });

        // Cancel button handler
        document.getElementById('cancelBtn').addEventListener('click', function() {
            cancelEdit();
        });

        // Load and display users
        function loadUsers() {
            fetch('/users')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(users => {
                    displayUsers(users);
                })
                .catch(error => {
                    console.error('Error loading users:', error);
                    showMessage('Error loading users: ' + error.message, 'error');
                    document.getElementById('usersTableBody').innerHTML =
                        '<tr><td colspan="5" class="no-users">Failed to load users</td></tr>';
                });
        }

        // Display users in the table
        function displayUsers(users) {
            loadedUsers = users;
            const tbody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="no-users">No users found. Add some users to get started!</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${escapeHtml(user.name)}</td>
                    <td>${escapeHtml(user.email)}</td>
                    <td>
                        ${isAdmin(user) ?
                            '<span class="admin-badge">👑 ADMIN</span>' :
                            '<span class="user-badge">👤 USER</span>'
                        }
                    </td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn-small btn-admin ${isAdmin(user) ? 'is-admin' : ''}"
                                    onclick="toggleAdmin(${user.id}, ${isAdmin(user)})">
                                ${isAdmin(user) ? 'PageTurnerte' : 'Promote'}
                            </button>
                            <button class="btn-small btn-edit"
                                    onclick="editLoadedUser(${user.id})">
                                Edit
                            </button>
                            <button class="btn-small btn-delete"
                                    onclick="deleteLoadedUser(${user.id})">
                                Delete
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function editLoadedUser(id) { const user = loadedUsers.find(user => user.id === id); if (user) editUser(id, user.name, user.email); }
        function deleteLoadedUser(id) { const user = loadedUsers.find(user => user.id === id); if (user) deleteUser(id, user.name); }

        // Toggle admin status
        function toggleAdmin(id, currentStatus) {
            const action = currentStatus ? 'remove admin privileges from' : 'grant admin privileges to';
            if (!confirm(`Are you sure you want to ${action} this user?`)) {
                return;
            }

            fetch(`/users/${id}/admin`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ isAdmin: !currentStatus })
            })
            .then(response => {
                return response.text().then(text => {
                    if (response.ok) {
                        return text;
                    } else {
                        throw new Error(text || `HTTP ${response.status}: ${response.statusText}`);
                    }
                });
            })
            .then(message => {
                showMessage(message, 'success');
                loadUsers();
            })
            .catch(error => {
                console.error('Toggle admin error:', error);
                showMessage(error.message || 'Failed to toggle admin status', 'error');
            });
        }

        // Add new user
        function addUser(name, email, password) {
            const userData = { name: name, email: email, password: password };

            fetch('/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData)
            })
            .then(response => {
                return response.text().then(text => {
                    if (response.ok) {
                        return text;
                    } else {
                        throw new Error(text || `HTTP ${response.status}: ${response.statusText}`);
                    }
                });
            })
            .then(message => {
                showMessage(message, 'success');
                clearForm();
                loadUsers();
            })
            .catch(error => {
                console.error('Add user error:', error);
                showMessage(error.message || 'Failed to add user', 'error');
            });
        }

        // Edit user (populate form)
        function editUser(id, name, email) {
            editingUserId = id;
            document.getElementById('userId').value = id;
            document.getElementById('userName').value = name;
            document.querySelector('.card h2').textContent = 'Edit user';
            document.getElementById('userName').focus();
            document.getElementById('userEmail').value = email;
            document.getElementById('userPassword').value = '';
            document.getElementById('userPassword').placeholder = 'Leave empty to keep current password';
            document.getElementById('userPassword').removeAttribute('required');
            document.getElementById('passwordNote').textContent = '(optional - leave empty to keep current)';
            document.getElementById('submitBtn').innerHTML = '💾 Update User';
            document.getElementById('cancelBtn').style.display = 'inline-block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Update user
        function updateUser(id, name, email, password) {
            const userData = { name: name, email: email };
            if (password)
                userData.password = password;

            fetch(`/users/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(userData)
            })
            .then(response => {
                return response.text().then(text => {
                    if (response.ok) {
                        return text;
                    } else {
                        throw new Error(text || `HTTP ${response.status}: ${response.statusText}`);
                    }
                });
            })
            .then(message => {
                showMessage(message, 'success');
                cancelEdit();
                loadUsers();
            })
            .catch(error => {
                console.error('Update user error:', error);
                showMessage(error.message || 'Failed to update user', 'error');
            });
        }

        // Delete user
        function deleteUser(id, name) {
            if (!confirm(`Are you sure you want to delete user "${name}"?`)) {
                return;
            }

            fetch(`/users/${id}`, {
                method: 'DELETE'
            })
            .then(response => {
                return response.text().then(text => {
                    if (response.ok) {
                        return text;
                    } else {
                        throw new Error(text || `HTTP ${response.status}: ${response.statusText}`);
                    }
                });
            })
            .then(message => {
                showMessage(message, 'success');
                loadUsers();
            })
            .catch(error => {
                console.error('Delete user error:', error);
                showMessage(error.message || 'Failed to delete user', 'error');
            });
        }

        // Cancel edit mode
        function cancelEdit() {
            editingUserId = null;
            document.querySelector('.card h2').textContent = 'Add new user';
            clearForm();
            document.getElementById('userPassword').placeholder = 'Password';
            document.getElementById('userPassword').setAttribute('required', 'required');
            document.getElementById('passwordNote').textContent = '(min. 6 characters)';
            document.getElementById('submitBtn').innerHTML = '➕ Add User';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Clear form
        function clearForm() {
            document.getElementById('userId').value = '';
            document.getElementById('userName').value = '';
            document.getElementById('userEmail').value = '';
            document.getElementById('userPassword').value = '';
        }

        // Show message to user
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.setAttribute('role', 'status');
            messageDiv.textContent = message;
            messageDiv.setAttribute('role', 'status');

            document.body.appendChild(messageDiv);

            setTimeout(() => {
                document.body.removeChild(messageDiv);
            }, 3000);
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
<script src="/js/ui.js" defer></script>
</body>
</html>
