<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account settings · PageTurner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/library.css">
    <script src="/js/session.js"></script>
</head>
<body class="page-settings">
<a class="skip-link" href="#main-content">Skip to content</a><nav class="site-nav" aria-label="Main navigation"><a class="brand-logo" href="/home"><span class="brand-mark" aria-hidden="true">P<span>t</span></span>PageTurner<span class="brand-dot">.</span></a><div class="nav-links"><a href="/home">Discover</a><a href="/admin">Dashboard</a><a href="/admin/users">Members</a><a href="/systeminfo">System</a><a href="/settings">Account</a></div></nav>


    <div class="settings-container" id="main-content" role="main">
        <div class="settings-header">
            <span class="settings-icon">👤</span>
            <h1>Profile Settings</h1>
            <p>Manage your account information</p>
        </div>

        <div class="user-info">
            <h3>Account Information</h3>
            <div class="info-item">
                <span class="info-label">Name:</span>
                <span class="info-value" id="userName">Loading...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Email:</span>
                <span class="info-value" id="userEmail">Loading...</span>
            </div>
            <div class="info-item">
                <span class="info-label">Account Type:</span>
                <span class="info-value" id="userRole">Loading...</span>
            </div>
        </div>

        <div class="section-divider"></div>

        <h2 class="section-title">Change Password</h2>

        <div id="messageContainer" role="status" aria-live="polite"></div>

        <form class="password-form" id="passwordForm">
            <div class="form-group">
                <label for="currentPassword">Current Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔓</span>
                    <input autocomplete="current-password" type="password" id="currentPassword" placeholder="Enter your current password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input autocomplete="new-password" type="password" id="newPassword" placeholder="Enter your new password" required minlength="6">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔐</span>
                    <input autocomplete="new-password" type="password" id="confirmNewPassword" placeholder="Re-enter your new password" required>
                </div>
            </div>

            <button type="submit" class="btn-update">Update Password</button>
        </form>
    </div>

    <script>
        let currentUser = null;

        // Load user information on page load
        window.addEventListener('DOMContentLoaded', async function() {
            try {
                currentUser = await PageTurnerSession.currentUser();
                document.getElementById('userName').textContent = currentUser.name;
                document.getElementById('userEmail').textContent = currentUser.email;
                document.getElementById('userRole').textContent = ['SUPER_ADMIN', 'TENANT_ADMIN'].includes(currentUser.role) ? 'Administrator' : 'Reader';
            } catch { showMessage('Please sign in to view your account.', 'error'); }
        });

        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;

            // Validation
            if (!currentPassword || !newPassword || !confirmNewPassword) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('New password must be at least 6 characters', 'error');
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showMessage('New passwords do not match', 'error');
                return;
            }

            if (currentPassword === newPassword) {
                showMessage('New password must be different from current password', 'error');
                return;
            }

            // Update password
            updatePassword(currentPassword, newPassword);
        });

        function updatePassword(oldPassword, newPassword) {
            if (!currentUser) {
                showMessage('User session not found', 'error');
                return;
            }

            fetch(`/users/${currentUser.id}/password`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ oldPassword, newPassword })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => { throw new Error(text); });
                    }
                    return response.text();
                })
                .then(message => {
                    showMessage('Password updated successfully!', 'success');

                    // Clear the form
                    document.getElementById('passwordForm').reset();

                })
                .catch(error => {
                    console.error('Password update error:', error);
                    showMessage(error.message || 'Failed to update password', 'error');
                });
        }

        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            messageElement.textContent = message;
            container.replaceChildren(messageElement);

            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
    </script>
<script src="/js/ui.js" defer></script>
</body>
</html>
