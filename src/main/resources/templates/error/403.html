<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/library.css">
    <script src="/js/session.js"></script>
</head>
<body class="page-error">
<a class="skip-link" href="#main-content">Skip to content</a>
    <div class="error-page" id="main-content" role="main">
        <div class="error-content">
            <div class="error-icon">🚫</div>
            <div class="error-code">403</div>
            <h1 class="error-title">Access Forbidden</h1>
            <p class="error-message">
                Sorry, you don't have permission to access this resource.<br>
                <strong>Administrator privileges required.</strong><br>
                Please contact your system administrator if you believe this is an error.
            </p>
            <a href="/home" class="btn">🏠 Go Home</a>
            <a href="/login" class="btn">🔐 Login</a>
        </div>
    </div>

    <script>
        // Clear any unauthorized session data
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Access denied - 403 Forbidden');
        });
    </script>
<script src="/js/ui.js" defer></script>
</body>
</html>
