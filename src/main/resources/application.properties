spring.application.name=PageTurner
# DevTools Configuration for Hot Reloading
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
# Thymeleaf Hot Reloading Configuration
spring.thymeleaf.cache=false
# Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
# Development Mode
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=100
spring.config.import=optional:file:.env[.properties]
# Use local MySQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Hibernate / JPA 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Strategy: SCHEMA (each tenant has separate schema in same database)
# Alternatives: DATABASE, DISCRIMINATOR
spring.jpa.properties.hibernate.multitenancy.strategy=${SPRING_JPA_PROPERTIES_HIBERNATE_MULTITENANCY_STRATEGY:NONE}
spring.jpa.properties.hibernate.multitenancy.identifier_resolver=${SPRING_JPA_PROPERTIES_HIBERNATE_MULTITENANCY_IDENTIFIER_RESOLVER:}
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
