<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong · PageTurner</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/library.css">
</head>
<body class="page-error">
<a class="skip-link" href="#main-content">Skip to content</a>
    <div class="error-container" id="main-content" role="main">
        <div class="error-code">😵</div>
        <h1 class="error-title">Oops! Something went wrong</h1>
        <p class="error-message">
            We encountered an unexpected error. Don't worry, it's not your fault!
        </p>
        <a href="/" class="home-button">🏠 Go Back Home</a>
        
        <div class="error-details">
            <p><strong>What can you do?</strong></p>
            <ul style="text-align: left; margin-top: 10px;">
                <li>Try refreshing the page</li>
                <li>Go back to the <a href="/" style="color: var(--ink); text-decoration: underline;">home page</a></li>
                <li>Check if the URL is correct</li>
                <li>Contact support if the problem persists</li>
            </ul>
        </div>
    </div>
<script src="/js/ui.js" defer></script>
</body>
</html>
