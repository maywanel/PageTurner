# Preserve legacy JSON POST /login and /register alongside the GET pages.
map $request_method $auth_service {
    default http://frontend:3000;
    POST http://backend:8080;
}

server {
    listen 80;
    server_name _;
    # Resolve service addresses again after containers are replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    set $frontend http://frontend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health { access_log off; return 200 "ok\n"; }
    location ~ ^/(api|users|books)(/|$) {
        proxy_pass $backend$request_uri;
    }
    location ~ ^/(login|register)$ { proxy_pass $auth_service$request_uri; }
    location = /_auth {
        internal;
        proxy_pass $backend/api/page-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /_auth_admin {
        internal;
        proxy_pass $backend/api/page-access?admin=true;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/(admin(/.*)?|systeminfo)$ {
        auth_request /_auth_admin;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        proxy_pass $frontend$request_uri;
    }
    location ~ ^/(home|settings)$ {
        auth_request /_auth;
        error_page 401 = @login;
        proxy_pass $frontend$request_uri;
    }
    location @login { return 302 /login?expired=1; }
    location @forbidden { return 302 /error/403; }
    location / { proxy_pass $frontend$request_uri; }
}
